<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A2A6B">
<title>IT BOOSTER · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="auth.css?v=1">
</head>
<body id="itbAdminPage" class="adm">

<section id="admLogin" class="adm-login">
  <div class="ag-wrap">
    <div class="ag-brand"><span class="ag-logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span><div><b>IT BOOSTER</b><small>Administrator</small></div></div>
    <form class="ag-card" id="admForm" novalidate>
      <h2>Admin login</h2><p class="ag-sub">Sign in with your administrator User ID and password.</p>
      <label>Admin User ID<input id="admEmail" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. ADMIN"></label>
      <label>Password<input id="admPw" type="password" autocomplete="current-password" placeholder="Password"></label>
      <div id="admLoginMsg" class="ag-msg hidden"></div>
      <button class="ag-primary" id="admLoginBtn" type="submit">Log in</button>
    </form>
  </div>
</section>

<div id="admApp" class="hidden">
  <header class="adm-top">
    <div class="adm-brand"><span class="ag-logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span><b>IT BOOSTER</b><span class="adm-pill">Admin</span></div>
    <nav class="adm-tabs" id="admTabs">
      <button data-t="apps" class="on">Applications <i id="bdApps" class="adm-badge hidden"></i></button>
      <button data-t="users">Users</button>
      <button data-t="ctrl">App control</button>
    </nav>
    <div class="adm-right"><span id="admWho" class="adm-who"></span><button type="button" id="admOut" class="adm-btn">Log out</button></div>
  </header>

  <main class="adm-main">
    <div id="admMsg" class="ag-msg hidden"></div>

    <section id="tab-apps">
      <div class="adm-kpis" id="kpiApps"></div>
      <div class="adm-bar"><div class="adm-seg" id="appFilter"><button data-f="pending" class="on">Pending</button><button data-f="approved">Approved</button><button data-f="rejected">Rejected</button><button data-f="all">All</button></div>
        <input id="appSearch" class="adm-search" placeholder="Search town, SAP code, name…"><button type="button" class="adm-btn" id="admRefresh">↻ Refresh</button></div>
      <div id="appList"></div>
    </section>

    <section id="tab-users" class="hidden">
      <div class="adm-kpis" id="kpiUsers"></div>
      <div class="adm-bar"><div class="adm-seg" id="userFilter"><button data-f="all" class="on">All</button><button data-f="active">Active</button><button data-f="suspended">Suspended</button></div>
        <input id="userSearch" class="adm-search" placeholder="Search ID, town, name…"></div>
      <div id="userList"></div>
    </section>

    <section id="tab-ctrl" class="hidden">
      <div class="adm-card">
        <h3>App control</h3>
        <p class="ag-sub">These switches apply to every user immediately.</p>
        <label class="adm-sw"><input type="checkbox" id="cEnabled"><span><b>App is ON</b><small>Turn off for maintenance. Users are blocked from logging in and from reading data.</small></span></label>
        <label class="adm-sw"><input type="checkbox" id="cReg"><span><b>Registrations open</b><small>When off, nobody can submit a new application.</small></span></label>
        <label class="adm-f">Maintenance message<input id="cMsg" placeholder="Shown when the app is OFF"></label>
        <label class="adm-f">Announcement banner<input id="cAnn" placeholder="Shown to logged-in users (leave empty for none)"></label>
        <button class="ag-primary adm-save" id="cSave" type="button">Save changes</button>
        <div id="cMsgOut" class="ag-msg hidden"></div>
      </div>
    </section>
  </main>
</div>

<script src="config.js?v=20261019b"></script>
<script src="auth.js?v=1"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
